name: CI

# Runs on every push and pull request.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SmbSpeedDoctor.sln

      # TreatWarningsAsErrors enforces ZERO warnings
      - name: Build (warnings = error)
        run: dotnet build SmbSpeedDoctor.sln -c Release --no-restore -warnaserror

      - name: Tests
        run: dotnet test SmbSpeedDoctor.sln -c Release --no-build --verbosity normal

  powershell-scripts:
    name: Scripts in PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          $failCount = 0
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count) {
              Write-Host "FAIL  $($_.Name): $($errors[0].Message)"
              $failCount++
            } else { Write-Host "OK    $($_.Name)" }
          }
          if ($failCount) { throw "$failCount script(s) do not compile in PowerShell 5.1" }

      - name: All .ps1 files require UTF-8 BOM
        shell: powershell
        run: |
          $missingBom = @()
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $b = [System.IO.File]::ReadAllBytes($_.FullName)
            if ($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) {
              $missingBom += $_.Name
            }
          }
          if ($missingBom.Count) {
            throw "missing UTF-8 BOM (breaks in PowerShell 5.1): $($missingBom -join ', ')"
          }
          Write-Host "all .ps1 files have UTF-8 BOM"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # entire history, not just last commit

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
